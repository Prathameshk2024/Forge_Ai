    <link

    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ForgeAI - Build. Learn. Launch. Generate full projects from a prompt and learn how they work." />
    <title>ForgeAI &middot; Build. Learn. Launch.</title>
    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // wrong palette. Mirrors readStoredTheme() in src/context/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('forgeai:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
