<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Same artwork as src/components/brand/Logo.tsx, flattened into a data
         URI. Update both together or the tab icon drifts from the in-app mark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='48' y2='48' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%239333EA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Cpath d='M11.5 15 7 22l4.5 7M36.5 15 41 22l-4.5 7' stroke='white' stroke-opacity='.85' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M15.5 13.5h6M15.5 28.5h6M18.5 13.5v15M25 13.5v15M25 13.5h3.5a3.75 3.75 0 0 1 0 7.5H25M25 21h4a3.75 3.75 0 0 1 0 7.5h-4' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M15.5 33.5h17' stroke='%23FBBF24' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IntelliBuild - Think. Build. Deploy. Generate full projects from a prompt and learn how they work." />
    <title>IntelliBuild &middot; Think. Build. Deploy.</title>
    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // wrong palette. Mirrors readStoredTheme() in src/context/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('intellibuild:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
